# The private stats read model (docs/api/stats_access.md): refresh it AFTER each hourly run.
#
# THIS IS A PRIVATE READ-ONLY STATISTICS INTERFACE. IT IS NOT THE FUTURE AUTOMATED-TRADING APPLICATION.
#
# Downstream only, by construction:
#   - no schedule of its own: it starts when the hourly workflow has COMPLETED, so it can never run
#     before, inside or instead of it, and the hourly workflow itself is not changed at all;
#   - it runs one command, `python -m agent.reporting.publish`, which reads the record through a
#     read-only connection and writes only the two derived-cache tables a signed-in viewer may read;
#   - it has no AI key and no heartbeat URL: it cannot call a model, and it cannot silence or fake an alarm;
#   - a failure here cannot touch the live record or the next hourly run (a separate workflow and job).
# tests/test_reporting_separation.py keeps every line of that true.

name: Reporting snapshot

on:
  workflow_run:
    workflows: ["Hourly Bitcoin analysis"]
    types: [completed]
  workflow_dispatch:

# Least privilege: the job only reads the repository. It never needs to write to GitHub.
permissions:
  contents: read

concurrency:
  group: reporting-snapshot
  cancel-in-progress: false

jobs:
  publish:
    # Only after an hourly run that succeeded (a failed one may have left the hour half-recorded).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-09-26
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned 2026-09-26
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish the private stats read model (read-only statistics)
        run: python -m agent.reporting.publish
