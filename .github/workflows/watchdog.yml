# Independent alarm: every three hours, check that the live record isn't stale.
# If the hourly job has been silently skipped, this job fails -- and GitHub emails
# the repository owner about failed scheduled jobs. Costs nothing, needs no external
# service. (Runs on GitHub's scheduler too, so it isn't a *complete* substitute for an
# outside heartbeat check, but two independent schedules rarely both go quiet.)

name: Watchdog

on:
  schedule:
    - cron: "33 */3 * * *"
  workflow_dispatch:

# Least privilege: the job only reads the repository. It never needs to write to GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Newest prediction must be less than 3 hours old
        run: python -m agent.healthcheck --max-age-hours 3

      # A single failed shadow hour is recorded and tolerated (it must not turn the hourly job
      # red every hour -- see agent/shadow/run.py). A persistent failure must still be alarmed.
      - name: Shadow job must not be failing repeatedly
        run: python -m agent.healthcheck --shadow-errors-max 2 --shadow-errors-hours 6

      # Security (2026-09-23): no table may be reachable through Supabase's public API. The schema
      # files lock down the tables they create, but only those, and only when applied -- a table
      # made later (for example in the dashboard) is exposed by Supabase's defaults the moment it
      # exists, and RLS can be switched off by hand. This is a detector, never a fixer: an exposure
      # fails this job so it is investigated, not silently "corrected".
      - name: No table may be exposed to the public API
        run: python -m agent.database.security

      # Least privilege (2026-09-26): the jobs must connect as `bitcoin_agent`, and that role must hold
      # exactly what docs/ops/least_privilege_role.sql grants -- no more (privilege creep), no less. Fails
      # if the DATABASE_URL secret is switched back to the owner, which would otherwise go unnoticed.
      - name: Jobs connect as the least-privilege role, with exactly its proven rights
        run: python -m agent.database.role_check --connected
