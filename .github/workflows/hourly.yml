# The hourly schedule. GitHub runs this on its own servers -- nothing on your
# computer needs to be on. Secrets (API keys, database URL) are added once in the
# repo's Settings -> Secrets and variables -> Actions, never written into this file.
#
# Reliability notes (learned on go-live day, 2026-09-19): GitHub's scheduler ran only
# 2 of the first 8 hourly slots for this repository, each 20-40 minutes late -- the
# behaviour widely reported for new, low-activity repos. So:
#   - four slots per hour: any one of them that fires does the hour's work; the rest
#     exit early before any AI call (the orchestrator checks whether the hour is saved)
#   - never exactly :00, when GitHub's queue is slowest
#   - a self-check step fails the job if no row landed, so a miss produces a failure
#     email instead of silence (see also watchdog.yml)
#   - workflow_dispatch lets an OUTSIDE scheduler trigger the job through GitHub's
#     API, which is the reliable path (see docs/ops/external_trigger.md)

name: Hourly Bitcoin analysis

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch: # manual runs from the Actions tab, and external triggers via the API

# Least privilege: the job only reads the repository. It never needs to write to GitHub.
permissions:
  contents: read

concurrency:
  group: hourly-analysis
  cancel-in-progress: false # let a late run finish; the next one exits early anyway

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      DIRECTION_HEARTBEAT_URL: ${{ secrets.DIRECTION_HEARTBEAT_URL }}  # the direction track's own check (2026-10-16)

    steps:
      # For the missed-hour signal near the end: a row this run saves is created after this moment.
      - name: Record when this job started
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-09-26

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned 2026-09-26
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly analysis
        run: python run.py

      - name: Grade past predictions
        run: python -m agent.outcome_tracker

      - name: Self-check that this hour's prediction was saved
        run: python -m agent.healthcheck --max-age-hours 2

      # Research SHADOW record (Phase 13): the frozen move-size model's probability for this
      # hour, in its own table. It never touches the live decision. It runs after the live
      # prediction is saved and self-checked, so a shadow failure can never cost an hour of
      # the live record; the weekly report audits shadow coverage, so a failure is still seen.
      - name: Shadow move-size probability
        run: python -m agent.shadow.run

      - name: Grade shadow rows
        run: python -m agent.shadow.outcomes

      # The backend contract, published as one row a frontend can read (docs/api/contract_v1.md).
      # Last among the real steps, so the snapshot describes this hour's finished work. It cannot
      # fail the job: any error is logged and it exits 0, leaving the previous snapshot in place --
      # visibly older, because the snapshot carries its own generated_at. An add-on must never be
      # able to cost an hour of the record it describes (incident 2026-09-21/22).
      - name: Publish the backend state
        run: python -m agent.api.publish

      # Research DIRECTION shadow track (E034, research/DIRECTION_TRACK.md): the frozen 1h direction probability, in
      # its own tables. Like the move-size shadow it never touches the live decision, and a failure is recorded in
      # shadow_direction_errors and exits 0 (only a failure to record it fails the step). It comes after the publish
      # step, so even that case can never skip the backend-state publish or cost an hour of the live record.
      - name: Shadow direction probability
        run: python -m agent.direction_shadow.run

      - name: Grade direction shadow rows
        run: python -m agent.direction_shadow.outcomes

      # The DIRECTION track's own alert (master plan addendum 2026-10-16), on its OWN healthchecks.io check, separate
      # from the main heartbeat below. A success ping when the latest closed hour has a valid direction observation;
      # ONE /fail per incident when an hour is lost for good (each lost hour and each recovery recorded once in
      # shadow_direction_health); nothing for a late but still recoverable hour. If no run gets here, the check's own
      # silence alarm fires. The assessment and its record run even without the secret; only the pings need it. It
      # runs after a failed step too (the hour may still have been recorded) and can never change the job's result.
      - name: Heartbeat direction track (its own check)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -m agent.direction_shadow.health --actions-file direction-actions.txt --fail-body-file direction-fail.txt
          if [ -n "$DIRECTION_HEARTBEAT_URL" ] && grep -qx fail direction-actions.txt; then curl -fsS -m 10 --retry 3 --data-binary @direction-fail.txt "${DIRECTION_HEARTBEAT_URL%/}/fail" > /dev/null; fi
          if [ -n "$DIRECTION_HEARTBEAT_URL" ] && grep -qx success direction-actions.txt; then curl -fsS -m 10 --retry 3 "$DIRECTION_HEARTBEAT_URL" > /dev/null; fi

      # FAILED AI CALLS (the user's approval, 2026-10-17, after the Anthropic key rotation). A failed AI call never fails
      # the job: the hour is saved without a news score and/or explanation, so an expired or invalid key would otherwise
      # hide behind a green heartbeat. Every run -- backup slots too -- looks at the NEWEST saved hour; if its news step or
      # explanation failed, it sends the report (error types only) as a failure signal and holds back the success ping
      # below, so the check stays down -- one "down" email -- until an hour is saved with working AI calls, whose run
      # pings "up" again. Like every heartbeat step it cannot change the job's result.
      - name: Heartbeat AI-failure signal
        if: ${{ !cancelled() && env.HEARTBEAT_URL != '' }}
        continue-on-error: true
        run: |
          python -m agent.healthcheck --ai-failure-body-file ai-failure.txt
          if [ -s ai-failure.txt ]; then echo "AI_FAILING=1" >> "$GITHUB_ENV"; curl -fsS -m 10 --retry 3 --data-binary @ai-failure.txt "${HEARTBEAT_URL%/}/fail" > /dev/null; fi

      # A SINGLE missed hour (2026-10-07: no run at all for one hour, and the pings either side were
      # 87 min apart, inside the 90 min allowance, so nothing alarmed). Nothing is ever backfilled, so an
      # hour is missing for good once a later hour is saved -- and only the run that saved that later
      # hour sees it as new. That run reports the gap to the heartbeat service as a failure, with the
      # missing hours in the body; the success ping right after turns the check green again. Each gap is
      # reported once, and a late run is never reported. A total GitHub outage is still caught by the
      # heartbeat's own silence alarm. This step cannot change the job's result; it also runs after a
      # failed later step, because the hour may have been saved before the failure.
      - name: Heartbeat missed-hour signal
        if: ${{ !cancelled() && env.HEARTBEAT_URL != '' }}
        continue-on-error: true
        run: |
          python -m agent.healthcheck --new-gap-since "$JOB_STARTED_AT" --gap-body-file missed-hours.txt
          if [ -s missed-hours.txt ]; then curl -fsS -m 10 --retry 3 --data-binary @missed-hours.txt "${HEARTBEAT_URL%/}/fail" > /dev/null; fi

      # Only reached if every step above succeeded. If the heartbeat service doesn't
      # hear from us within its grace window, it emails you -- an alarm that lives
      # outside GitHub entirely, so it also catches GitHub itself being down.
      # continue-on-error: a ping that cannot be delivered must not turn a good hour red. If pings
      # stop arriving, the heartbeat service raises the alarm itself -- that is its whole job.
      # Held back while the newest saved hour's AI calls failed (AI_FAILING, set by the step above), so that
      # check stays down instead of flipping straight back to "up".
      - name: Heartbeat ping
        if: env.HEARTBEAT_URL != '' && env.AI_FAILING != '1'
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" > /dev/null

      # A FAILED run tells the heartbeat service at once (healthchecks.io's "/fail" signal) instead
      # of the alarm waiting out the grace window. Harmless with another service: an unknown path
      # just fails here, and this step can never change the job's result.
      - name: Heartbeat failure signal
        if: failure() && env.HEARTBEAT_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "${HEARTBEAT_URL%/}/fail" > /dev/null
