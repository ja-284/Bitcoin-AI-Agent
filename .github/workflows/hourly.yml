# The hourly schedule. GitHub runs this on its own servers -- nothing on your
# computer needs to be on. Secrets (API keys, database URL) are added once in the
# repo's Settings -> Secrets and variables -> Actions, never written into this file.
#
# Reliability notes (learned on go-live day, 2026-09-19): GitHub's scheduler ran only
# 2 of the first 8 hourly slots for this repository, each 20-40 minutes late -- the
# behaviour widely reported for new, low-activity repos. So:
#   - four slots per hour: any one of them that fires does the hour's work; the rest
#     exit early before any AI call (the orchestrator checks whether the hour is saved)
#   - never exactly :00, when GitHub's queue is slowest
#   - a self-check step fails the job if no row landed, so a miss produces a failure
#     email instead of silence (see also watchdog.yml)
#   - workflow_dispatch lets an OUTSIDE scheduler trigger the job through GitHub's
#     API, which is the reliable path (see docs/ops/external_trigger.md)

name: Hourly Bitcoin analysis

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch: # manual runs from the Actions tab, and external triggers via the API

# Least privilege: the job only reads the repository. It never needs to write to GitHub.
permissions:
  contents: read

concurrency:
  group: hourly-analysis
  cancel-in-progress: false # let a late run finish; the next one exits early anyway

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-09-26

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned 2026-09-26
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly analysis
        run: python run.py

      - name: Grade past predictions
        run: python -m agent.outcome_tracker

      - name: Self-check that this hour's prediction was saved
        run: python -m agent.healthcheck --max-age-hours 2

      # Research SHADOW record (Phase 13): the frozen move-size model's probability for this
      # hour, in its own table. It never touches the live decision. It runs after the live
      # prediction is saved and self-checked, so a shadow failure can never cost an hour of
      # the live record; the weekly report audits shadow coverage, so a failure is still seen.
      - name: Shadow move-size probability
        run: python -m agent.shadow.run

      - name: Grade shadow rows
        run: python -m agent.shadow.outcomes

      # The backend contract, published as one row a frontend can read (docs/api/contract_v1.md).
      # Last among the real steps, so the snapshot describes this hour's finished work. It cannot
      # fail the job: any error is logged and it exits 0, leaving the previous snapshot in place --
      # visibly older, because the snapshot carries its own generated_at. An add-on must never be
      # able to cost an hour of the record it describes (incident 2026-09-21/22).
      - name: Publish the backend state
        run: python -m agent.api.publish

      # Only reached if every step above succeeded. If the heartbeat service doesn't
      # hear from us within its grace window, it emails you -- an alarm that lives
      # outside GitHub entirely, so it also catches GitHub itself being down.
      # continue-on-error: a ping that cannot be delivered must not turn a good hour red. If pings
      # stop arriving, the heartbeat service raises the alarm itself -- that is its whole job.
      - name: Heartbeat ping
        if: env.HEARTBEAT_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" > /dev/null

      # A FAILED run tells the heartbeat service at once (healthchecks.io's "/fail" signal) instead
      # of the alarm waiting out the grace window. Harmless with another service: an unknown path
      # just fails here, and this step can never change the job's result.
      - name: Heartbeat failure signal
        if: failure() && env.HEARTBEAT_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "${HEARTBEAT_URL%/}/fail" > /dev/null
